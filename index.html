                                                        />
                                                        <div className="absolute top-2 right-2">
                                                            <button 
                                                                onClick={(e) => openMap(act.map, e)}
                                                                className="bg-white/90 backdrop-blur text-blue-600 p-2 rounded-full hover:bg-blue-500 hover:text-white transition-all shadow-md"
                                                            >
                                                                <Icons.Map size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="p-4">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded ${act.isFood ? 'text-orange-600 bg-orange-100' : 'text-indigo-600 bg-indigo-50'}`}>{act.time}</span>
                                                        {act.isFood && <span className="text-[10px] font-bold text-orange-500 bg-white px-1.5 py-0.5 rounded border border-orange-100">Recommended</span>}
                                                    </div>
                                                    <h3 className="font-bold text-base text-gray-900 mb-1">{act.title}</h3>
                                                    <div className="text-sm text-gray-700 font-medium leading-snug mb-1">{act.detail}</div>
                                                    <div className="text-xs text-gray-400">
                                                        {act.sub}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    
                    </div>

                    {/* Bottom Navigation Bar */}
                    <div className="bg-white border-t border-gray-200 flex justify-around items-center h-16 fixed bottom-0 w-full max-w-md z-40 pb-2 safe-area-bottom">
                        <button 
                            onClick={() => { setView('home'); window.scrollTo(0,0); }}
                            className={`flex flex-col items-center justify-center w-full h-full ${view === 'home' || view === 'detail' || view === 'checklist' ? 'text-indigo-600' : 'text-gray-400'}`}
                        >
                            <Icons.Home size={24} strokeWidth={view === 'home' || view === 'detail' || view === 'checklist' ? 2.5 : 2} />
                            <span className="text-[10px] font-medium mt-1">Home</span>
                        </button>
                        <button 
                            onClick={() => { setView('tools'); window.scrollTo(0,0); }}
                            className={`flex flex-col items-center justify-center w-full h-full ${view === 'tools' ? 'text-indigo-600' : 'text-gray-400'}`}
                        >
                            <Icons.Tool size={24} strokeWidth={view === 'tools' ? 2.5 : 2} />
                            <span className="text-[10px] font-medium mt-1">Tools</span>
                        </button>
                        <button 
                            onClick={() => { setView('converter'); window.scrollTo(0,0); }}
                            className={`flex flex-col items-center justify-center w-full h-full ${view === 'converter' ? 'text-indigo-600' : 'text-gray-400'}`}
                        >
                            <Icons.Currency size={24} strokeWidth={view === 'converter' ? 2.5 : 2} />
                            <span className="text-[10px] font-medium mt-1">Converter</span>
                        </button>
                    </div>

                    {/* Modals & Popups */}

                    {/* Language Popup Overlay */}
                    {selectedPhrase && (
                        <div 
                            className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-6"
                            onClick={() => setSelectedPhrase(null)}
                        >
                            <div 
                                className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl popup-enter relative text-center"
                                onClick={e => e.stopPropagation()}
                            >
                                <button 
                                    onClick={() => setSelectedPhrase(null)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
                                >
                                    <Icons.X size={24} />
                                </button>
                                
                                <div className="mb-6 mt-2">
                                    <div className="text-sm font-bold text-indigo-500 uppercase tracking-wider mb-1">ENGLISH</div>
                                    <div className="text-xl font-bold text-slate-800">{selectedPhrase.t}</div>
                                </div>

                                <div className="bg-indigo-50 rounded-2xl p-4 mb-2">
                                    <div className="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2">JAPANESE</div>
                                    <div className="text-2xl font-bold text-indigo-900 mb-1">{selectedPhrase.k}</div>
                                    <div className="text-sm text-indigo-600 font-medium">{selectedPhrase.j}</div>
                                </div>
                                
                                <div className="text-xs text-gray-400 mt-4">Tap outside to close</div>
                            </div>
                        </div>
                    )}

                    {/* Hotel Info Modal */}
                    {showHotelCard && (
                        <div 
                            className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-6"
                            onClick={() => setShowHotelCard(false)}
                        >
                            <div 
                                className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl popup-enter relative"
                                onClick={e => e.stopPropagation()}
                            >
                                <button 
                                    onClick={() => setShowHotelCard(false)}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
                                >
                                    <Icons.X size={24} />
                                </button>
                                
                                <div className="text-center mb-6">
                                    <div className="inline-block p-3 bg-indigo-50 text-indigo-600 rounded-full mb-3">
                                        <Icons.Bed size={32} />
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-800">Show to Taxi Driver</h3>
                                    <p className="text-xs text-gray-500">ยื่นหน้านี้ให้คนขับแท็กซี่ดูได้เลย</p>
                                </div>

                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-4 text-center">
                                    <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-2">DESTINATION</p>
                                    <div className="text-2xl font-bold text-slate-900 leading-snug mb-1">スイスホテル<br/>南海大阪</div>
                                    <div className="text-sm text-slate-600 font-medium">Swissôtel Nankai Osaka</div>
                                    <hr className="my-3 border-slate-200"/>
                                    <p className="text-xs text-slate-500">〒542-0076 大阪府大阪市中央区難波5-1-60</p>
                                </div>

                                <button 
                                    onClick={() => setShowHotelCard(false)}
                                    className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-transform"
                                >
                                    Close Card
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
