                                                    <button 
                                                        key={item.id}
                                                        onClick={() => toggleCheck(item.id)}
                                                        className={`w-full text-left p-3.5 flex items-center gap-3 transition-colors ${itemIdx !== cat.items.length - 1 ? 'border-b border-gray-100' : ''} hover:bg-gray-50 active:bg-gray-100`}
                                                    >
                                                        <div className={`shrink-0 transition-colors ${checkedItems[item.id] ? 'text-green-500' : 'text-gray-300'}`}>
                                                            {checkedItems[item.id] ? <Icons.CheckCircle size={22} fill="currentColor" className="text-green-100" /> : <Icons.Circle size={22} />}
                                                        </div>
                                                        <span className={`text-sm font-medium ${checkedItems[item.id] ? 'text-gray-400 line-through' : 'text-slate-700'}`}>
                                                            {item.text}
                                                        </span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- DETAIL VIEW --- */}
                    {view === 'detail' && selectedDay && (
                        <div className="page-enter flex flex-col min-h-screen bg-slate-50">
                            
                            {/* Sticky Nav */}
                            <div className="sticky top-0 pt-8 pb-3 px-4 flex items-center justify-between bg-white/80 backdrop-blur-md shadow-sm z-30 border-b border-gray-100">
                                <button onClick={goHome} className="p-2 -ml-1 rounded-full hover:bg-gray-100 text-slate-700 active:bg-gray-200 transition-colors">
                                    <Icons.ArrowLeft size={22} />
                                </button>
                                <div className="text-center">
                                    <div className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">{selectedDay.day}</div>
                                    <div className="font-bold text-sm text-slate-800">{selectedDay.title}</div>
                                </div>
                                <div className="w-9"></div> 
                            </div>

                            <div className="flex-grow px-5 py-5 pb-20">
                                
                                {/* Trip Trick Box */}
                                {selectedDay.trick && (
                                    <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4 mb-6 flex items-start gap-3 shadow-sm">
                                        <div className="bg-amber-100 p-1.5 rounded-full text-amber-500 mt-0.5 shrink-0">
                                            <Icons.Lightbulb size={18} />
                                        </div>
                                        <div>
                                            <h4 className="text-[10px] font-extrabold text-amber-800 uppercase tracking-widest mb-1">Trip Trick</h4>
                                            <p className="text-sm text-amber-900/80 font-medium leading-relaxed">{selectedDay.trick}</p>
                                        </div>
                                    </div>
                                )}

                                {/* Timeline */}
                                <div className="space-y-6 border-l-[2px] border-gray-200 ml-3 pl-8">
                                    {selectedDay.activities.map((act, i) => (
                                        <div key={i} className="relative group">
                                            {/* Icon Dot */}
                                            <div className={`absolute -left-[41px] top-0 bg-white border-2 p-1.5 rounded-full shadow-sm z-10 group-hover:scale-110 transition-transform ${act.isFood ? 'border-orange-500 text-orange-500' : 'border-indigo-500 text-indigo-500'}`}>
                                                {/* SAFETY CHECK: Ensure icon exists */}
                                                {act.icon ? React.cloneElement(act.icon, { size: 16 }) : <Icons.Circle size={16} />}
                                            </div>
                                            
                                            {/* Card */}
                                            <div className={`rounded-2xl shadow-sm border overflow-hidden active:scale-[0.99] transition-transform ${act.isFood ? 'bg-orange-50 border-orange-200' : 'bg-white border-gray-100'}`}>
                                                {/* Image Placeholder with Safety Check */}
                                                {act.image && (
                                                    <div className="h-32 w-full overflow-hidden bg-gray-100 relative">
                                                        <img 
                                                            src={act.image} 
                                                            alt={act.title} 
                                                            onError={handleImageError} 
                                                            className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" 
                                                        />
                                                        <div className="absolute top-2 right-2">
                                                            <button 
                                                                onClick={(e) => openMap(act.map, e)}
                                                                className="bg-white/90 backdrop-blur text-blue-600 p-2 rounded-full hover:bg-blue-500 hover:text-white transition-all shadow-md"
                                                            >
                                                                <Icons.Map size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="p-4">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded ${act.isFood ? 'text-orange-600 bg-orange-100' : 'text-indigo-600 bg-indigo-50'}`}>{act.time}</span>
                                                        {act.isFood && <span className="text-[10px] font-bold text-orange-500 bg-white px-1.5 py-0.5 rounded border border-orange-100">Recommended</span>}
                                                    </div>
                                                    <h3 className="font-bold text-base text-gray-900 mb-1">{act.title}</h3>
                                                    <div className="text-sm text-gray-700 font-medium leading-snug mb-1">{act.detail}</div>
                                                    <div className="text-xs text-gray-400">
                                                        {act.sub}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
